# Minimal deployment for a homelab cluster.
#   kubectl apply -f deploy/k8s.yaml
#
# The app is entirely local-first — no backend, no database, no env config.
# Every user's data lives in their own browser, so replicas are stateless and
# you can scale or reschedule this freely.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seventyfivesoft
  labels:
    app.kubernetes.io/name: seventyfivesoft
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seventyfivesoft
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seventyfivesoft
    spec:
      # Only needed while the GHCR package is private — see README
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the uid baked into nginx-unprivileged
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Pin to a sha- tag instead of latest if you want deploys to be
          # explicit rather than dependent on imagePullPolicy.
          image: ghcr.io/seinhtettan/seventyfivesoft:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # To also set readOnlyRootFilesystem: true, mount emptyDirs at
            # /tmp and /var/cache/nginx — nginx needs both to be writable.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: seventyfivesoft
  labels:
    app.kubernetes.io/name: seventyfivesoft
spec:
  selector:
    app.kubernetes.io/name: seventyfivesoft
  ports:
    - name: http
      port: 80
      targetPort: http
---
