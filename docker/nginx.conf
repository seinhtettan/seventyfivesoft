server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the version on error pages
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

    # Probe target for k8s readiness/liveness
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so a change always changes the URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # These four must be revalidated on every request. If the service worker
    # or the shell is cached, an installed home-screen app keeps booting the
    # old build and never picks up a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { } default_type application/manifest+json;
    }

    # Icons change rarely but aren't fingerprinted — a day is a fair trade
    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Single-page app: /week, /journal and friends resolve to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }
}
